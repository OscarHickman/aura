name: Build and Deploy

# Pushes to main publish :latest and :<sha> images.
# Pushing a tag vX.Y.Z also deploys that image to the home server and builds
# the Android release.

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DEPLOY_HOST: 100.88.127.35
  APP_HEALTH_TIMEOUT_SECONDS: 180

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: image-tags
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${REPO}:latest,${REPO}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${REPO}:${GITHUB_REF_NAME}"
          fi
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/aura:latest,${DOCKERHUB_USERNAME}/aura:${GITHUB_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="gh-runner-aura-${GITHUB_RUN_ID}"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF

      - name: Upload compose file
        run: |
          ssh deploy-target "mkdir -p ~/docker/aura/data ~/docker/aura/user_credentials ~/docker/aura/qdrant_storage ~/docker/aura/redis_data"
          scp deploy/docker-compose.yml deploy-target:~/docker/aura/docker-compose.yml

      - name: Log in to GHCR on the server
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo "GHCR_PAT not set; relying on the public image."
            exit 0
          fi
          # Pass the token on stdin so it never appears in a command line or trace.
          printf '%s' "$GHCR_PAT" | ssh deploy-target "docker login ghcr.io -u '${GITHUB_REPOSITORY_OWNER,,}' --password-stdin"

      - name: Pull and restart
        run: |
          ssh deploy-target "RELEASE_TAG='${RELEASE_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/docker/aura
          touch .env
          [ -f config.yaml ] || touch config.yaml
          sed -i '/^TAG=/d' .env
          echo "TAG=${RELEASE_TAG}" >> .env
          # Free disk before pulling; the server has run out of space mid-pull before.
          docker image prune -af --filter "until=24h"
          docker builder prune -f
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          REMOTE

      - name: Verify deployment health
        run: |
          ssh deploy-target "RELEASE_TAG='${RELEASE_TAG}' TIMEOUT='${APP_HEALTH_TIMEOUT_SECONDS}' bash -s" <<'REMOTE'
          set -euo pipefail
          image=$(docker inspect -f '{{.Config.Image}}' aura_app)
          echo "Running image: ${image}"
          case "$image" in
            *":${RELEASE_TAG}") ;;
            *) echo "::error::aura_app is running ${image}, expected tag ${RELEASE_TAG}"; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + TIMEOUT ))
          while true; do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' aura_app)
            echo "health: ${status}"
            [ "$status" = "healthy" ] && exit 0
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::aura_app did not become healthy within ${TIMEOUT}s"
              docker logs --tail 80 aura_app
              exit 1
            fi
            sleep 5
          done
          REMOTE

      - name: Disconnect from Tailscale
        if: always()
        run: sudo tailscale logout || true

  build-android:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships the Android SDK with licenses accepted
      # (ANDROID_HOME); android-actions/setup-android failed on a license prompt.
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Type check mobile
        working-directory: mobile
        run: pnpm tsc --noEmit

      - name: Set app version from tag
        working-directory: mobile
        run: |
          # vMAJOR.MINOR.PATCH -> versionCode MAJOR*10000 + MINOR*100 + PATCH,
          # so the code always increases with the tag and is stable across re-runs.
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android = { ...app.expo.android, versionCode: Number(process.env.VERSION_CODE) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log(`version ${app.expo.version} (versionCode ${app.expo.android.versionCode})`);
          '

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Android bundle and APK
        working-directory: mobile/android
        run: |
          SIGNING_ARGS=()
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then
            # Override the Expo template's debug signing with the upload key.
            SIGNING_ARGS=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          else
            echo "::warning::No release keystore configured; artifacts are debug-signed and will not be uploaded to Google Play."
          fi
          ./gradlew bundleRelease assembleRelease --no-daemon "${SIGNING_ARGS[@]}"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release-assets/aura-${GITHUB_REF_NAME}.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "release-assets/aura-${GITHUB_REF_NAME}.aab"
          ls -l release-assets

      - name: Upload to Google Play
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oscarhickman.aura
          releaseFiles: release-assets/aura-${{ github.ref_name }}.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          # Play only accepts 'draft' until the app's first release has been
          # rolled out in the console; then set the variable to 'completed'.
          status: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
