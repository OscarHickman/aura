name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test and Smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: v2-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install dev dependencies
        run: pip install ruff gunicorn

      - name: Lint with ruff
        run: ruff check .

      - name: Run mypy type check
        run: mypy .

      - name: Run unit tests
        env:
          LLM_API_KEY: dummy-test-key
          GROQ_API_KEY: dummy-test-key
          OPENAI_API_KEY: dummy-test-key
          ANTHROPIC_API_KEY: dummy-test-key
          GOOGLE_API_KEY: dummy-test-key
        run: pytest --cov=aura --cov-fail-under=65

      - name: Set up Node for mobile contract test
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm for mobile contract test
        if: matrix.python-version == '3.11'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Test mobile client against Flask
        if: matrix.python-version == '3.11'
        working-directory: mobile
        env:
          AURA_CONTRACT_PYTHON: python
        run: |
          pnpm install --frozen-lockfile
          pnpm exec jest --runInBand contract.test.js

      - name: Verify Redis worker task round trip
        env:
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          celery -A aura.tasks.celery_app worker --loglevel=info --concurrency=2 > celery.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          python -c 'from aura import __version__; from aura.tasks import worker_smoke_task; result = worker_smoke_task.delay().get(timeout=60); assert result == {"status": "ok", "version": __version__}, result; print(result)' || { cat celery.log; exit 1; }

      - name: Start Gunicorn (smoke)
        run: |
          nohup gunicorn "deploy.wsgi:app" -w 1 --threads 8 --timeout 120 -b 127.0.0.1:5000 > gunicorn.log 2>&1 & echo $! > gunicorn.pid
          sleep 2

      - name: Smoke test /health endpoint
        run: |
          curl -f http://127.0.0.1:5000/health

      - name: Stop Gunicorn
        if: always()
        run: |
          kill $(cat gunicorn.pid) || true

  mobile-check:
    name: Mobile Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Type check mobile
        working-directory: mobile
        run: pnpm tsc --noEmit

      - name: Run mobile unit tests
        working-directory: mobile
        run: pnpm test:ci

      - name: Compile Android JavaScript bundle
        working-directory: mobile
        run: pnpm exec expo export --platform android --output-dir /tmp/aura-android-export

